name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83' wheel
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,model]"
      - name: Format and lint
        run: python scripts/tasks.py lint
      - name: Strict typecheck
        run: python scripts/tasks.py typecheck
      - name: Tests with coverage
        run: python scripts/tasks.py test
      - name: Build wheel and validate packaged YAML profiles
        run: |
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir /tmp/tfs-wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("/tmp/tfs-wheel").glob("*.whl"))
          with ZipFile(wheel) as archive:
              members = set(archive.namelist())
          expected = {f"tfs/configs/{n}.yaml" for n in ("tiny", "small", "gpt2-124m")}
          assert expected <= members, f"wheel missing: {sorted(expected - members)}"
          print(f"Verified packaged YAML profiles in {wheel.name}")
          PY
      - name: Audit dependencies
        run: python -m pip_audit
      - name: Smoke CLI
        run: python -m tfs config --profile tiny
      - name: Tiny tokenizer benchmark
        run: python bench/tokenizer.py --output results/tokenizer-smoke.json --print-json
      - name: Render benchmark table
        run: python results/render.py results/tokenizer-smoke.json
      - name: One-step CPU model demo
        run: python scripts/demo.py --profile tiny --steps 1 --output results/demo-ci.json --print-json
      - name: Synthetic scaling smoke
        run: |
          python eval/study.py --study scaling --steps 2 --output results/scaling-ci.json --print-json
          python results/study_render.py results/scaling-ci.json
      - name: CPU KV-cache benchmark
        run: python bench/kv_cache.py --output results/kv-cache-ci.json --print-json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hf-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only reference testing dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83' wheel
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[model]" pytest==9.1.1 transformers==4.38.2
      - name: Compare offline random HF GPT-2 reference logits
        run: python -m pytest -q -s tests/test_hf_compat.py
