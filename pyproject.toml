[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-from-scratch"
version = "0.0.0"
description = "A decoder-only transformer implemented from first principles"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyYAML>=6,<7",
  "regex>=2024.11,<2028",
]

[project.optional-dependencies]
model = ["torch>=2.2,<3"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "hypothesis>=6,<7",
  "pip-audit>=2.7,<3",
  "pre-commit>=4,<5",
]

[project.scripts]
tfs = "tfs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: tests requiring substantial compute",
  "gpu: tests requiring a CUDA GPU",
  "network: tests requiring downloads or network access",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/tfs"]
[[tool.mypy.overrides]]
module = ["yaml", "regex"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["tfs"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70
